<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>シフト給与計算（休憩時間対応・完全版）</title>
    <link rel="stylesheet" href="shift.css">
</head>
<body>

<div class="container">
    <h2>シフト給与計算</h2>

    <div class="upload-area">
        <div class="field">
            <label for="apiKey">Groq APIキー</label>
            <input type="password" id="apiKey" placeholder="gsk_... から始まるキーを入力" autocomplete="off">
        </div>
        <div class="field">
            <label for="personName">対象者の名前（シフト表に書かれている通り）</label>
            <input type="text" id="personName" placeholder="例: 優">
        </div>

        <div class="wage-settings">
            <label>お店の時給ルール設定</label>
            <div class="wage-tier">
                <span>①</span>
                <input type="time" id="t1_start" value="05:00"> 〜 <input type="time" id="t1_end" value="17:00">
                は <input type="number" id="w1" value="1080" step="10"> 円
            </div>
            <div class="wage-tier">
                <span>②</span>
                <input type="time" id="t2_start" value="17:00"> 〜 <input type="time" id="t2_end" value="22:00">
                は <input type="number" id="w2" value="1180" step="10"> 円
            </div>
            <div class="wage-tier">
                <span>③</span>
                <input type="time" id="t3_start" value="22:00"> 〜 <input type="time" id="t3_end" value="05:00">
                は <input type="number" id="w3" value="1350" step="10"> 円
            </div>
        </div>

        <div class="field">
            <label for="imageInput">シフト表の画像</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <details id="rowMode" class="row-selection" hidden>
            <summary>対象者の行を指定して解析する</summary>
            <p>月間表の写真では、対象者の勤務欄を1日から月末まで選びます。氏名や右端の勤務合計を囲まないように、左上 → 右上 → 右下 → 左下の順にクリックしてください。</p>
            <div class="row-controls">
                <label for="rowMonth">シフト表の年月 <input type="month" id="rowMonth"></label>
                <label for="rowZoom">プレビューの拡大 <select id="rowZoom"><option value="100">全体</option><option value="175">175%</option><option value="250">250%</option></select></label>
                <button type="button" id="rowReset" disabled>選び直す</button>
            </div>
            <p id="rowGuide" role="status"></p>
            <div class="row-image-scroll">
                <canvas id="rowCanvas" aria-label="シフト表の範囲指定プレビュー" hidden></canvas>
            </div>
        </details>
        <div class="field expected-work-time">
            <label for="expectedWorkTime">シフト表に記載の勤務時間（照合用・任意）</label>
            <input type="text" id="expectedWorkTime" placeholder="例 54:45" autocomplete="off">
        </div>
        <button id="runBtn">画像を解析して計算する</button>
        <div id="status" role="status"></div>
    </div>

    <div class="manual-area">
        <h3>手入力でシフトを追加</h3>
        <div class="manual-inputs">
            <div>
                <label>日付</label>
                <input type="text" id="manualDate" placeholder="例: 6/5">
            </div>
            <div>
                <label>出勤時間</label>
                <input type="time" id="manualStart">
            </div>
            <div>
                <label>退勤時間</label>
                <input type="time" id="manualEnd">
            </div>
            <div>
                <label>休憩(分)</label>
                <input type="number" id="manualBreak" value="0" min="0" step="1">
            </div>
            <button onclick="addManualShift()" class="add-btn">➕ 追加</button>
        </div>
    </div>

    <details id="imagePreview" class="image-preview" hidden>
        <summary>解析に使った画像を表示</summary>
        <img id="previewImage" alt="解析に使ったシフト表">
    </details>
    <p id="shiftEditHint" class="shift-edit-hint" hidden>一覧で日付・出退勤時刻・休憩を修正できます。変更すると給与も更新されます。</p>
    <div class="shift-table-scroll">
        <table aria-label="シフト一覧">
            <thead>
                <tr>
                    <th>#</th>
                    <th>日付</th>
                    <th>出勤 〜 退勤</th>
                    <th>休憩(分)</th>
                    <th>日給</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="shiftTableBody"></tbody>
        </table>
    </div>

    <div class="total-box">
        <span id="payLabel">合計支給額</span> <span id="totalPay">0</span> 円
        <small id="shiftCount"></small>
        <small id="workedTime"></small>
        <small id="workTimeCheck" role="status" hidden></small>
    </div>
</div>

<script src="shift-image.js"></script>
<script src="shift.js"></script>
</body>
</html>
